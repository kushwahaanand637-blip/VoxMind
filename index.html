
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoxMind AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sidebar">
    <h2>VoxMind</h2>
    <button class="new-chat">+ New Chat</button>
  </div>
  
  <div class="chat-container">
    <div class="chat-header">
      <h3>VoxMind AI (Gemini 1.5)</h3>
    </div>
    
    <div class="chat-box" id="chatBox">
      <div class="message ai-message">
        Hello! Main VoxMind hoon. Main aapki kya madad kar sakta hoon?
      </div>
    </div>

    <div class="input-container">
      <input type="text" id="userInput" placeholder="Message VoxMind..." onkeydown="if(event.key==='Enter') askVoxMind()">
      <button onclick="askVoxMind()">Send</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
